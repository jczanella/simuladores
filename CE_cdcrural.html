<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --blue:#1b3c6b;
  --blue-light:#2451a0;
  --blue-pale:#e8eef7;
  --bg:#f5f7fa;
  --card:#ffffff;
  --text:#1a1a2e;
  --text-soft:#5a6377;
  --border:#dde3ed;
  --radius:14px;
  --shadow:0 2px 8px rgba(27,60,107,.10);
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:48px;
}

header{
  background:var(--blue);
  color:#fff;
  padding:20px 20px 18px;
  display:flex;
  align-items:center;
  gap:14px;
}
.header-text h1{font-size:1.1rem;font-weight:700;letter-spacing:.2px;}
.header-text p{font-size:.78rem;opacity:.72;margin-top:3px;}

main{max-width:900px;margin:0 auto;padding:28px 16px 0;}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 20px;
  margin-bottom:20px;
}
.card-title{
  font-size:.75rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  color:var(--text-soft);
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

/* ── FORM ── */
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{
  font-size:.72rem;font-weight:600;
  letter-spacing:.4px;text-transform:uppercase;
  color:var(--text-soft);
}
.field input,.field select{
  padding:9px 11px;
  border:1.5px solid var(--border);
  border-radius:8px;
  font-family:inherit;font-size:.93rem;
  color:var(--text);background:#fff;
  outline:none;transition:border-color .15s;width:100%;
}
.field input:focus,.field select:focus{border-color:var(--blue);}

.hint{margin-top:12px;font-size:.78rem;color:var(--text-soft);line-height:1.5;}
.taxa-info{
  padding:9px 11px;
  border:1.5px solid var(--border);
  border-radius:8px;
  font-size:.93rem;
  color:var(--blue);font-weight:600;
  background:var(--blue-pale);
}

.erro-msg{
  margin-top:12px;padding:10px 14px;
  background:#fff3f3;border:1.5px solid #f5c6c6;
  border-radius:8px;color:#c0392b;
  font-size:.84rem;font-weight:500;
}

/* ── BUTTONS ── */
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 20px;
  border:none;border-radius:8px;
  font-family:inherit;font-size:.88rem;font-weight:600;
  cursor:pointer;transition:all .15s;text-decoration:none;
}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-light);}
.btn-secondary{background:var(--bg);color:var(--blue);border:1.5px solid var(--border);}
.btn-secondary:hover{background:var(--blue-pale);border-color:var(--blue);}
.btn-ghost{background:transparent;color:rgba(255,255,255,.8);border:1.5px solid rgba(255,255,255,.3);margin-left:auto;}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
.btn svg{width:16px;height:16px;fill:currentColor;}

#resultado{margin-top:4px;}

/* ── BANNER ── */
.cet-banner{
  background:var(--blue-pale);border:1px solid #c3d1e8;
  border-radius:10px;padding:12px 18px;
  display:flex;align-items:center;gap:18px;
  margin-bottom:18px;flex-wrap:wrap;
}
.cet-item{display:flex;flex-direction:column;gap:2px;}
.cet-label{font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-soft);}
.cet-value{font-size:1.05rem;font-weight:700;color:var(--blue);}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{
  width:100%;border-collapse:collapse;
  background:#fff;font-size:.83rem;
  font-variant-numeric:tabular-nums;
}
thead th{
  background:var(--blue);color:#fff;
  padding:9px 12px;text-align:right;
  font-size:.72rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  white-space:nowrap;
}
thead th:first-child{text-align:center;width:52px;}
thead th:nth-child(2){text-align:left;}

tbody tr:nth-child(even){background:#f8f9fc;}
tbody td{padding:7px 12px;text-align:right;border-bottom:1px solid #eef0f5;color:var(--text);}
tbody td:first-child{text-align:center;color:var(--text-soft);font-size:.78rem;width:52px;}
tbody td:nth-child(2){text-align:left;}
tbody tr:hover{background:var(--blue-pale);}

tfoot tr{background:var(--blue);}
tfoot td{
  padding:9px 12px;text-align:right;
  color:#fff;font-weight:700;font-size:.83rem;
  font-variant-numeric:tabular-nums;
}
tfoot td:first-child{text-align:center;width:52px;font-weight:400;opacity:.8;}
tfoot td:nth-child(2){text-align:left;font-weight:400;opacity:.8;}
tfoot td:nth-child(3){opacity:.8;font-weight:400;}

/* ── PROTEÇÃO ── */
.protecao{
  margin-top:18px;background:#fff;
  border:1px solid var(--border);border-radius:10px;padding:14px 16px;
}
.protecao p{font-size:.72rem;color:var(--text-soft);line-height:1.6;margin-bottom:4px;}
.protecao p:last-child{margin-bottom:0;}
</style>
</head>
<body>

<header>
  <div class="header-text">
    <h1>Simulador CDC Rural</h1>
    <p>Linha CE / CDC Novos Rural</p>
  </div>
  <a href="index.html" class="btn btn-ghost" style="padding:8px 14px;font-size:.82rem;">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Voltar ao Início
  </a>
</header>

<main>

  <!-- ── FORMULÁRIO ── -->
  <div class="card">
    <div class="card-title">Parâmetros da Simulação</div>

    <div class="form-grid">

      <div class="field">
        <label>Valor do Bem (R$)</label>
        <input id="valor" placeholder="0">
      </div>

      <div class="field">
        <label>Entrada (%)</label>
        <input id="percEntrada" type="text" inputmode="decimal" placeholder="0">
      </div>

      <div class="field">
        <label>Entrada (R$)</label>
        <input id="valorEntrada" placeholder="0">
      </div>

      <div class="field">
        <label>Periodicidade</label>
        <select id="selectPeriodicidade" onchange="onPeriodicidade()">
          <option value="12" selected>Anual</option>
          <option value="6">Semestral</option>
        </select>
      </div>

      <div class="field">
        <label>Carência (meses)</label>
        <select id="selectCarencia"></select>
      </div>

      <div class="field">
        <label>Número de Parcelas</label>
        <select id="selectParcelas" onchange="atualizarTaxa()"></select>
      </div>

      <div class="field">
        <label>Taxa de Juros</label>
        <div id="taxaInfo" class="taxa-info">0,00% a.a. / 0,00% a.m.</div>
      </div>

    </div>

    <div id="taxaHint" class="hint"></div>
    <div id="erroEntrada" class="erro-msg" style="display:none"></div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="simular()">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
        Simular
      </button>
      <button class="btn btn-secondary" onclick="gerarPDF()">
        <svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
        Gerar PDF
      </button>
    </div>
  </div>

  <!-- ── RESULTADO ── -->
  <div id="resultado"></div>

</main>

<script>

// ========= UTIL =========
function parseBR(v){return Number((v||"").replace(/\./g,"").replace(",",".")||0);}
function round2(v){return Math.round(v*100)/100;}
function trunc2(v){return Math.trunc(v*100)/100;}
function format2(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function parsePerc(v){return parseFloat((v||'').replace(',','.'))||0;}
function formatPerc(v){
  let r=Math.round(v*100)/100;
  if(r%1===0) return String(Math.round(r));
  return r.toFixed(2).replace(/0+$/,'').replace('.',',');
}
function aaParaAm(aa){return Math.pow(1+aa,1/12)-1;}

function mask(el){
  el.addEventListener("input",()=>{
    let raw=el.value.replace(/\D/g,"");
    if(!raw){el.value="";return;}
    el.value=Number(raw).toLocaleString("pt-BR");
  });
}

// ========= CONSTANTES =========
// DI CONSTRUÇÃO 16-26 (14/04/2026), CDC NOVOS RURAL, inalterado nos DIs 28-26 e 44-26.
// Taxa a.a. por tabela de prazo. Atualizar quando sair nova tabela de taxas.
const TAXAS_PRAZO={12:0.1959,24:0.1978,36:0.1991,48:0.2005,60:0.2018};
const PRAZO_MAX=60;     // DI: até 60 meses → 5 parcelas anuais ou 10 semestrais
const CARENCIA_MIN=1;
const CARENCIA_MAX=15;  // DI: até 15 meses
const TAC=0;            // Financiamentos rurais não têm TAC (usuário, 01/10/2026)

// ========= PERIODICIDADE / CARÊNCIA / PARCELAS =========
function periodoMeses(){return parseInt(selectPeriodicidade.value);}

// Tabela de prazo da taxa: anual 1→12, 2→24...; semestral 1 e 2→12, 3 e 4→24... (igual ao Excel oficial)
function mesesTabela(n,per){return Math.ceil(n*per/12)*12;}

function montarSelectCarencia(){
  for(let m=CARENCIA_MIN;m<=CARENCIA_MAX;m++){
    selectCarencia.add(new Option(m+(m===1?" mês":" meses"),m));
  }
}
function montarSelectParcelas(){
  let nMax=PRAZO_MAX/periodoMeses();
  selectParcelas.innerHTML="";
  for(let n=1;n<=nMax;n++) selectParcelas.add(new Option(String(n),n));
  selectParcelas.value=nMax;  // padrão = máximo
}
// Ao trocar a periodicidade: carência volta a 1 período e parcelas ao máximo
function onPeriodicidade(){
  selectCarencia.value=periodoMeses();
  montarSelectParcelas();
  atualizarTaxa();
}
function atualizarTaxa(){
  let m=mesesTabela(parseInt(selectParcelas.value),periodoMeses());
  let aa=TAXAS_PRAZO[m];
  taxaInfo.textContent=format2(aa*100)+'% a.a. / '+format2(aaParaAm(aa)*100)+'% a.m.';
  taxaHint.textContent='Taxa da tabela de '+m+' meses.';
}

// ========= DATAS =========
// 1º vencimento = dia 15 do mês (hoje + carência); seguintes a cada período, sempre dia 15.
// Sem ajuste de dia útil (igual ao Excel oficial do CDC Rural).
function gerarData(base,mes){
  return new Date(base.getFullYear(),base.getMonth()+mes,15);
}
// DIAS360 do Excel (método americano)
function dias360(a,b){
  const ultFev=x=>x.getMonth()===1&&x.getDate()===new Date(x.getFullYear(),2,0).getDate();
  let d1=a.getDate(), d2=b.getDate();
  if(ultFev(a)&&ultFev(b)) d2=30;
  if(ultFev(a)) d1=30;
  if(d2===31&&d1>=30) d2=30;
  if(d1===31) d1=30;
  return (b.getFullYear()-a.getFullYear())*360+(b.getMonth()-a.getMonth())*30+d2-d1;
}

// ========= CET (XIRR do Excel: dias corridos / 365) =========
function calcularCETAnual(fluxo){
  let taxa=0.1;
  for(let k=0;k<200;k++){
    let f=0,df=0;
    fluxo.forEach(({dias,valor})=>{
      let t=dias/365;
      f+=valor/Math.pow(1+taxa,t);
      df+=-t*valor/Math.pow(1+taxa,t+1);
    });
    if(Math.abs(df)<1e-12) break;
    let nt=taxa-f/df;
    if(Math.abs(nt-taxa)<1e-9) break;
    taxa=nt;
  }
  return taxa;
}

// ========= ESTADO GLOBAL =========
let tabela=[];
let simParams={};

const PROTECAO=[
  "a) O fluxo apresenta valores aproximados, que poderão variar de acordo com cada operação e o período de carência pactuado.",
  "b) Os valores apresentados não são vinculativos.",
  "c) Simulação sujeita a aprovação de crédito conforme política do Agente Financeiro.",
  "d) As condições comerciais disponíveis informadas nesta proposta estão sujeitas a alteração a qualquer momento e sem aviso prévio.",
  "e) O seguro dos bens financiados (ramo Penhor Rural) é condição para a liberação do crédito e não está incluído nesta simulação.",
];
const NOTA_CAPITALIZACAO="Na 1ª parcela, os juros acumulados na carência superam o valor da parcela: a diferença é incorporada ao saldo devedor.";

// ========= INIT =========
window.onload=function(){
  mask(valor);
  mask(valorEntrada);
  montarSelectCarencia();
  selectCarencia.value=periodoMeses();
  montarSelectParcelas();
  atualizarTaxa();

  percEntrada.oninput=()=>{
    let raw=percEntrada.value.replace(/[^0-9,]/g,'');
    let parts=raw.split(',');
    if(parts.length>2) raw=parts[0]+','+parts.slice(1).join('');
    if(parts.length===2&&parts[1].length>2) raw=parts[0]+','+parts[1].slice(0,2);
    if(percEntrada.value!==raw) percEntrada.value=raw;
    let p=parsePerc(raw);
    if(p>100){percEntrada.value='100';p=100;}
    let v=parseBR(valor.value);
    if(!v||isNaN(p))return;
    valorEntrada.value=format2(v*p/100);
  };
  percEntrada.onblur=()=>{
    let p=parsePerc(percEntrada.value);
    if(percEntrada.value===''||isNaN(p))return;
    p=Math.min(Math.max(Math.round(p*100)/100,0),100);
    percEntrada.value=formatPerc(p);
    let v=parseBR(valor.value);
    if(v) valorEntrada.value=format2(v*p/100);
  };
  valorEntrada.oninput=()=>{
    let v=parseBR(valor.value);
    let e=parseBR(valorEntrada.value);
    if(!v||!e){percEntrada.value='';return;}
    let p=Math.min(Math.round(e/v*10000)/100,100);
    percEntrada.value=formatPerc(p);
  };
  valorEntrada.onblur=()=>{
    let v=parseBR(valor.value);
    let e=parseBR(valorEntrada.value);
    if(!v||!e)return;
    let p=Math.min(Math.round(e/v*10000)/100,100);
    percEntrada.value=formatPerc(p);
    valorEntrada.value=format2(v*p/100);
  };
};

// ========= SIMULAÇÃO =========
function simular(){
  gtag('event','simular',{simulador:document.title});
  let valorV=parseBR(valor.value);
  if(!valorV){alert("Informe o valor do bem.");return;}

  let perc=Math.min(Math.max(Math.round(parsePerc(percEntrada.value||'0')*100)/100,0),100);

  let erroEl=document.getElementById('erroEntrada');
  erroEl.style.display='none';
  if(perc>=100){
    erroEl.textContent='Entrada de 100%: não há valor a financiar.';
    erroEl.style.display='block';
    return;
  }

  let entrada=round2(valorV*perc/100);
  valorEntrada.value=format2(entrada);
  percEntrada.value=formatPerc(perc);

  let per=periodoMeses();
  let mesesCar=parseInt(selectCarencia.value);
  let nParcelas=parseInt(selectParcelas.value);
  let taxaAa=TAXAS_PRAZO[mesesTabela(nParcelas,per)];
  let taxaMes=aaParaAm(taxaAa);
  let saldoFin=round2(valorV-entrada);

  // IOF do Excel oficial: ((financiado × 0,38%) + financiado) × 0,38%. Financiado junto com o bem.
  let iofBruto=((saldoFin*0.0038)+saldoFin)*0.0038;
  let totalBruto=saldoFin+iofBruto+TAC;
  let iof=round2(iofBruto);
  let total=round2(totalBruto);

  let hoje=new Date();
  hoje=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());

  let datas=[];
  for(let i=0;i<nParcelas;i++) datas.push(gerarData(hoje,mesesCar+i*per));

  // Parcela igual (Price) para vencimentos irregulares: total ÷ Σ desconto(dias360/30), truncada (Excel oficial)
  let somaDesc=datas.reduce((a,d)=>a+1/Math.pow(1+taxaMes,dias360(hoje,d)/30),0);
  let pmt=trunc2(totalBruto*(1/somaDesc));

  tabela=[];
  let fluxo=[{dias:0,valor:-saldoFin}];  // CET: cliente recebe o saldoFin (IOF é custo financiado)
  let saldo=total;
  let anterior=hoje;

  datas.forEach((dataAtual,idx)=>{
    let i=idx+1;
    // Price: juros sobre o saldo do período; amortização = parcela − juros; última quita o saldo
    let juros=round2(saldo*(Math.pow(1+taxaMes,dias360(anterior,dataAtual)/30)-1));
    let amort,parcela;
    if(i<nParcelas){
      amort=round2(pmt-juros);
      parcela=pmt;
    } else {
      amort=saldo;
      parcela=round2(amort+juros);
    }
    tabela.push([i,dataAtual.toLocaleDateString("pt-BR"),saldo,amort,juros,parcela]);
    fluxo.push({dias:Math.round((dataAtual-hoje)/86400000),valor:parcela});
    saldo=round2(saldo-amort);
    anterior=dataAtual;
  });

  let cetAnual=calcularCETAnual(fluxo);
  let cetMensal=aaParaAm(cetAnual);

  let totAmort=round2(tabela.reduce((a,r)=>a+r[3],0));
  let totJuros=round2(tabela.reduce((a,r)=>a+r[4],0));
  let totValor=round2(tabela.reduce((a,r)=>a+r[5],0));

  let textos=[...PROTECAO];
  if(tabela[0][3]<0) textos.push(NOTA_CAPITALIZACAO);

  simParams={valorV,perc,entrada,nParcelas,mesesCar,saldoFin,iof,total,
    labelPrazo:`${nParcelas} ${per===12?(nParcelas===1?'parcela anual':'parcelas anuais'):(nParcelas===1?'parcela semestral':'parcelas semestrais')}`,
    taxaMes:format2(taxaMes*100),taxaAa:format2(taxaAa*100),
    cetMensal:format2(cetMensal*100),cetAnual:format2(cetAnual*100),
    pmt,totAmort,totJuros,totValor,textos};

  // ── HTML RESULTADO ──
  let html=`
  <div class="cet-banner">
    <div class="cet-item"><span class="cet-label">Parcela</span><span class="cet-value">R$ ${format2(pmt)}</span></div>
    <div class="cet-item"><span class="cet-label">IOF</span><span class="cet-value">R$ ${format2(iof)}</span></div>
    <div class="cet-item"><span class="cet-label">CET</span><span class="cet-value">${format2(cetAnual*100)}% a.a.</span></div>
    <div class="cet-item"><span class="cet-label">CET</span><span class="cet-value">${format2(cetMensal*100)}% a.m.</span></div>
    <div class="cet-item"><span class="cet-label">Total Pago</span><span class="cet-value">R$ ${format2(totValor)}</span></div>
  </div>
  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Data</th>
        <th>Saldo Devedor</th>
        <th>Amortização</th>
        <th>Juros</th>
        <th>Valor Parcela</th>
      </tr>
    </thead>
    <tbody>`;

  tabela.forEach(r=>{
    html+=`<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${format2(r[2])}</td>
      <td>${format2(r[3])}</td>
      <td>${format2(r[4])}</td>
      <td><strong>${format2(r[5])}</strong></td>
    </tr>`;
  });

  html+=`
    </tbody>
    <tfoot>
      <tr>
        <td>—</td>
        <td>TOTAL</td>
        <td>—</td>
        <td>${format2(totAmort)}</td>
        <td>${format2(totJuros)}</td>
        <td>${format2(totValor)}</td>
      </tr>
    </tfoot>
  </table>
  </div>
  <div class="protecao">`;

  textos.forEach(t=>{html+=`<p>${t}</p>`;});
  html+=`</div>`;

  resultado.innerHTML=html;
}

// ========= PDF =========
function gerarPDF(){
  if(!tabela.length){alert("Simule primeiro.");return;}
  gtag('event','gerar_pdf',{simulador:document.title});

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=doc.internal.pageSize.getWidth();
  const H=doc.internal.pageSize.getHeight();
  const BLUE=[27,60,107];
  const WHITE=[255,255,255];
  const GRAY=[90,99,119];
  const now=new Date();
  const p=simParams;

  // ── FAIXA AZUL ──
  doc.setFillColor(...BLUE);
  doc.rect(0,0,W,8,"F");
  doc.setFontSize(7);doc.setFont("helvetica","bold");doc.setTextColor(...WHITE);
  doc.text("Simulador CDC Rural  |  Linha CE / CDC Novos Rural",10,5.2);
  doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(180,200,230);
  doc.text(`Simulado em ${now.toLocaleDateString("pt-BR")} às ${now.toTimeString().slice(0,5)}`,W-10,5.2,{align:"right"});

  // ── BLOCO DE PARÂMETROS ── (3 linhas × 4 colunas = 12 campos)
  let y=13;
  doc.setFillColor(248,249,252);doc.setDrawColor(221,227,237);
  doc.roundedRect(10,y,W-20,42,2,2,"FD");

  doc.setFontSize(6.2);doc.setFont("helvetica","bold");doc.setTextColor(...GRAY);
  doc.text("PARÂMETROS DA SIMULAÇÃO",14,y+5);

  const campos=[
    ["Valor do Bem",     `R$ ${format2(p.valorV)}`],
    ["Entrada",          `${formatPerc(p.perc)}%  (R$ ${format2(p.entrada)})`],
    ["Saldo Financiado", `R$ ${format2(p.saldoFin)}`],
    ["IOF",              `R$ ${format2(p.iof)}`],
    ["Total Financiado", `R$ ${format2(p.total)}`],
    ["Prazo",            p.labelPrazo],
    ["Carência",         `${p.mesesCar} ${p.mesesCar===1?'mês':'meses'}`],
    ["Taxa de Juros",    `${p.taxaAa}% a.a.  |  ${p.taxaMes}% a.m.`],
    ["CET",              `${p.cetAnual}% a.a.  |  ${p.cetMensal}% a.m.`],
    ["Valor da Parcela", `R$ ${format2(p.pmt)}`],
    ["Total de Juros",   `R$ ${format2(p.totJuros)}`],
    ["Total Pago",       `R$ ${format2(p.totValor)}`],
  ];

  const colW=(W-20)/4;
  campos.forEach(([lbl,val],i)=>{
    let cx=10+(i%4)*colW+3;
    let cy=y+8+Math.floor(i/4)*11;
    doc.setFontSize(6);doc.setFont("helvetica","normal");doc.setTextColor(...GRAY);
    doc.text(lbl.toUpperCase(),cx,cy);
    doc.setFontSize(7.5);doc.setFont("helvetica","bold");doc.setTextColor(15,20,45);
    let lines=doc.splitTextToSize(val,colW-4);
    doc.text(lines[0],cx,cy+4.5);
  });

  y+=46;

  // ── TABELA ──
  const marginL=10,marginR=10;
  const tableW=W-marginL-marginR;
  const colNum=10;
  const colRest=(tableW-colNum)/5;

  const head=[["#","Data","Saldo Devedor\n(R$)","Amortização\n(R$)","Juros\n(R$)","Valor Parcela\n(R$)"]];

  const rows=tabela.map(r=>[
    String(r[0]),r[1],
    format2(r[2]),format2(r[3]),
    format2(r[4]),
    format2(r[5])
  ]);

  rows.push(["—","TOTAL","—",format2(p.totAmort),format2(p.totJuros),format2(p.totValor)]);

  doc.autoTable({
    startY:y,head:head,body:rows,
    margin:{left:marginL,right:marginR},
    styles:{font:"helvetica",fontSize:6.8,cellPadding:1.8,textColor:[15,20,45],
      lineColor:[221,227,237],lineWidth:0.15,overflow:"linebreak"},
    headStyles:{fillColor:BLUE,textColor:WHITE,fontSize:6.2,fontStyle:"bold",
      halign:"right",cellPadding:2,minCellHeight:0},
    columnStyles:{
      0:{halign:"center",cellWidth:colNum},
      1:{halign:"left",  cellWidth:colRest},
      2:{halign:"right", cellWidth:colRest},
      3:{halign:"right", cellWidth:colRest},
      4:{halign:"right", cellWidth:colRest},
      5:{halign:"right", cellWidth:colRest,fontStyle:"bold"}
    },
    alternateRowStyles:{fillColor:[248,249,252]},
    didParseCell:function(data){
      if(data.section==="body"&&data.row.index===rows.length-1){
        data.cell.styles.fillColor=BLUE;
        data.cell.styles.textColor=WHITE;
        data.cell.styles.fontStyle="bold";
        data.cell.styles.fontSize=7.2;
      }
    }
  });

  // ── TEXTO DE PROTEÇÃO ──
  let finalY=doc.lastAutoTable.finalY+5;
  const maxTxtW=W-28;
  doc.setFontSize(6.2);doc.setFont("helvetica","normal");
  let textoLinhas=[];
  p.textos.forEach(t=>{textoLinhas.push(...doc.splitTextToSize(t,maxTxtW),"");});
  textoLinhas.pop();
  let altBloco=textoLinhas.length*3.4+9;

  if(finalY+altBloco>H-8){doc.addPage();finalY=12;}
  doc.setFillColor(248,249,252);doc.setDrawColor(221,227,237);
  doc.roundedRect(10,finalY,W-20,altBloco,2,2,"FD");
  doc.setFontSize(6.2);doc.setFont("helvetica","bold");doc.setTextColor(...GRAY);
  doc.text("INFORMAÇÕES IMPORTANTES",14,finalY+5);
  doc.setFont("helvetica","normal");doc.setTextColor(70,80,100);
  let ty=finalY+9.5;
  textoLinhas.forEach(linha=>{
    if(ty>H-10){doc.addPage();ty=12;}
    doc.text(linha,14,ty);ty+=3.4;
  });

  function fmtK(v){
    if(v>=1000000){let m=v/1000000;return(m%1===0?String(Math.round(m)):m.toFixed(1).replace('.',','))+' mi';}
    let k=v/1000;return(k%1===0?String(Math.round(k)):k.toFixed(1).replace('.',','))+' mil';
  }
  doc.save(`CDC Rural CE ${fmtK(p.valorV)} ${formatPerc(p.perc)}% ${p.nParcelas}x.pdf`);
}
