<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  --blue-light:#2451a0;

}

body{

  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:48px;

header{
  background:var(--blue);
  color:#fff;
  padding:20px 20px 18px;

.card{
  background:var(--card);

  margin-bottom:20px;
}
.card-title{
  font-size:.75rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  color:var(--text-soft);
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));

}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{

  font-family:inherit;

}
.field input:focus,.field select:focus{border-color:var(--blue);}

}

/* info strip */

.btn-secondary:hover{background:var(--blue-pale);border-color:var(--blue);}
.btn-ghost{background:transparent;color:rgba(255,255,255,.8);border:1.5px solid rgba(255,255,255,.3);margin-left:auto;}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
.btn svg{width:16px;height:16px;fill:currentColor;}

#resultado{margin-top:4px;}

.cet-banner{
  background:var(--blue-pale);
  border:1px solid #c3d1e8;
  border-radius:10px;
  padding:12px 18px;
  display:flex;align-items:center;gap:18px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.cet-item{display:flex;flex-direction:column;gap:2px;}
.cet-label{font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-soft);}
.cet-value{font-size:1.05rem;font-weight:700;color:var(--blue);}

.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{
  width:100%;border-collapse:collapse;
  background:#fff;font-size:.83rem;

}
thead th{
  background:var(--blue);color:#fff;

thead th:first-child{text-align:center;width:52px;}
thead th:nth-child(2){text-align:left;}

tbody tr:nth-child(even){background:#f8f9fc;}
tbody td{

  border-bottom:1px solid #eef0f5;

}
tbody td:first-child{text-align:center;color:var(--text-soft);font-size:.78rem;width:52px;}
tbody td:nth-child(2){text-align:left;}

tfoot tr{background:var(--blue);}

}
tfoot td:first-child{text-align:center;width:52px;font-weight:400;opacity:.8;}
tfoot td:nth-child(2){text-align:left;font-weight:400;opacity:.8;}
tfoot td:nth-child(3){opacity:.8;font-weight:400;}

  margin-bottom:4px;

.protecao p:last-child{margin-bottom:0;}

<body>

<header>
  <div class="header-text">

<main>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="simular()">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
        Simular
      </button>
      <button class="btn btn-secondary" onclick="gerarPDF()">
        <svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
        Gerar PDF
      </button>
    </div>
  </div>

  <div id="resultado"></div>

</main>

<script>

// ========= UTIL =========
function parseBR(v){return Number((v||"").replace(/\./g,"").replace(",",".")||0);}
function round2(v){return Math.round(v*100)/100;}
function format2(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function aaParaAm(aa){return Math.pow(1+aa,1/12)-1;}

function mask(el){
  el.addEventListener("input",()=>{
    let raw=el.value.replace(/\D/g,"");
    if(!raw){el.value="";return;}
    el.value=Number(raw).toLocaleString("pt-BR");
  });
}

// ========= TAXAS (TFC TR — DI Construção 45-26, cotação de 01/10/2026) =========
// Mais Inovação — Difusão Tecnológica, linha Crédito Rural Construção (produtor rural PF).
// Atualizar a cada DI mensal de Construção.
const TAXAS={
  MPME:[{rotulo:"TFC TR 60/90",aa:0.1123},{rotulo:"TFC TR 120/90",aa:0.1194}],
  GP:  [{rotulo:"TFC TR 60/90",aa:0.1242},{rotulo:"TFC TR 120/90",aa:0.1325}]
};
let taxaAnual=TAXAS.MPME[0].aa;

// ========= PARÂMETROS DO PROGRAMA (DI CE 24-26 / DI CE 45-26) =========
const CARENCIA_MIN=3;
const CARENCIA_MAX=12;
const PRAZO_MAX_MESES=96;

// ========= FERIADOS NACIONAIS (calculados por regra; o Excel oficial usa feriados reais, inclusive 15/11) =========
function pascoa(ano){
  let a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(ano,mes-1,dia);
}
const _feriadosCache={};
function feriadosDoAno(ano){
  if(_feriadosCache[ano])return _feriadosCache[ano];
  let p=pascoa(ano);
  let rel=n=>{let d=new Date(p);d.setDate(d.getDate()+n);return d;};
  let lista=[
    new Date(ano,0,1),rel(-48),rel(-47),rel(-2),new Date(ano,3,21),new Date(ano,4,1),
    rel(60),new Date(ano,8,7),new Date(ano,9,12),new Date(ano,10,2),new Date(ano,10,15),
    new Date(ano,10,20),new Date(ano,11,25)
  ];
  return _feriadosCache[ano]=new Set(lista.map(d=>d.toDateString()));
}
function eFeriado(d){return feriadosDoAno(d.getFullYear()).has(d.toDateString());}
function proximoDiaUtil(d){
  let r=new Date(d);
  while(r.getDay()===0||r.getDay()===6||eFeriado(r)) r.setDate(r.getDate()+1);
  return r;
}
// dia 15 do mês (base + mes) — monta a data direto, sem setMonth sobre o dia atual (evita estouro em dia 29–31)
function gerarData(base,mes){
  return proximoDiaUtil(new Date(base.getFullYear(),base.getMonth()+mes,15));
}

// ========= JUROS (idêntico ao Excel oficial Mais Inovação Rural) =========
// ROUND((1+taxa)^(dias/diasNoAno(vencimento))-1, 6) × saldo, arredondado a 2 casas
function diasNoAno(data){
  let a=data.getFullYear();
  return (a%4===0&&(a%100!==0||a%400===0))?366:365;
}
function jurosPeriodo(saldo,taxa,dias,dataRef){
  let rate=Math.round((Math.pow(1+taxa,dias/diasNoAno(dataRef))-1)*1e6)/1e6;
  return round2(saldo*rate);
}

// ========= CET =========
// Newton-Raphson; t = soma de dias/diasNoAno(vencimento) de cada período (mesma convenção dos juros).
// Sem IOF e sem tarifa, o CET resulta igual à taxa contratada (como no Excel oficial).
function calcularCETAnual(fluxo){
  let taxa=0.10;
  for(let k=0;k<200;k++){
    let f=0,df=0;
    fluxo.forEach(fx=>{
      let t=fx.t;
      f+=fx.valor/Math.pow(1+taxa,t);
      df+=-t*fx.valor/Math.pow(1+taxa,t+1);
    });
    if(Math.abs(df)<1e-12)break;
    let nt=taxa-f/df;
    if(Math.abs(nt-taxa)<1e-10)break;
    taxa=nt;
  }
  return taxa;
}

// ========= ESTADO GLOBAL =========
let tabela=[];
let simParams={};

const PROTECAO=[
  "a) Simulação considera IOF isento e tarifa de abertura de crédito isenta, conforme condições do programa Mais Inovação (Difusão Tecnológica) — linha Crédito Rural.",
  "b) O fluxo apresenta valores aproximados, que poderão variar de acordo com cada operação e normas do BNDES. Os valores apresentados não são vinculativos.",
  "c) Simulação sujeita a aprovação de crédito conforme política do Agente Financeiro.",
  "d) A taxa TFC TR apresentada refere-se à cotação divulgada pelo Agente Financeiro para o mês vigente. A taxa que valerá para o financiamento será a cotação fixada na data da contratação da operação, que deverá ocorrer em até 120 dias da aprovação do financiamento, com liberação do recurso em até 90 dias da contratação.",
  "e) Linha destinada a produtor rural pessoa física, para equipamentos de construção novos, nacionais, credenciados no CFI do BNDES. Não é permitida a antecipação de parcelas — somente a liquidação total ou parcial do saldo devedor."
];

// ========= HELPERS =========
function periodoMeses(){return parseInt(selectPeriodicidade.value);}
// nº de parcelas dentro do prazo total (carência + períodos): floor((prazo − carência)/período) + 1
function calcNParcelas(mesesCar,periodo,prazoMeses){
  return Math.floor((prazoMeses-mesesCar)/periodo)+1;
}
// Prazo total efetivo = mês do último vencimento (≤ prazoMeses)
function calcPrazoTotal(mesesCar,periodo,prazoMeses){
  return mesesCar+(calcNParcelas(mesesCar,periodo,prazoMeses)-1)*periodo;
}
function hoje(){
  let n=new Date();
  return new Date(n.getFullYear(),n.getMonth(),n.getDate());
}
function fmtTaxa(aa){
  return format2(aa*100)+"% a.a. ("+format2(aaParaAm(aa)*100)+"% a.m.)";
}

// ========= TAXA / STRIP =========
function atualizarTaxa(){
  let opc=TAXAS[selectPorte.value][parseInt(selectCusto.value)];
  taxaAnual=opc.aa;
  taxaExibida.value=fmtTaxa(taxaAnual);
}
function atualizarStrip(){
  let mesesCar=parseInt(selectCarencia.value);
  let periodo=periodoMeses();
  let prazoMeses=parseInt(selectPrazo.value)*12;
  let nParcelas=calcNParcelas(mesesCar,periodo,prazoMeses);
  let prazoTotal=calcPrazoTotal(mesesCar,periodo,prazoMeses);
  let labelPer=periodo===6?"semestrais":"anuais";
  let data0=gerarData(hoje(),mesesCar);
  infoStrip.innerHTML=
    `<strong>${nParcelas} parcelas ${labelPer}</strong>`+
    `<span>1º vencimento: ${data0.toLocaleDateString("pt-BR")}</span>`+
    `<span>Carência: ${mesesCar} meses</span>`+
    `<span>Prazo total: ${prazoTotal} meses (${(prazoTotal/12).toFixed(1).replace(".",",")} anos)</span>`;
}
// Prazo (anos): do menor ano que comporta ao menos 1 parcela até 8 anos (96 meses)
function atualizarSelectPrazo(){
  let mesesCar=parseInt(selectCarencia.value);
  let periodo=periodoMeses();
  let minAnos=Math.ceil((mesesCar+periodo)/12);
  let maxAnos=PRAZO_MAX_MESES/12;
  let atual=parseInt(selectPrazo.value)||maxAnos;
  selectPrazo.innerHTML='';
  for(let a=minAnos;a<=maxAnos;a++){
    selectPrazo.add(new Option(a+(a===1?" ano":" anos"),a));
  }
  selectPrazo.value=Math.min(Math.max(atual,minAnos),maxAnos);
  atualizarStrip();
}

// ========= INIT =========
window.onload=function(){
  mask(valor);
  mask(valorEntrada);

  // Custo financeiro conforme o porte
  function montarCustos(){
    selectCusto.innerHTML='';
    TAXAS[selectPorte.value].forEach((t,i)=>{
      selectCusto.add(new Option(t.rotulo+" — "+fmtTaxa(t.aa),i));
    });
    selectCusto.value=0;
    atualizarTaxa();
  }
  montarCustos();
  selectPorte.onchange=montarCustos;
  selectCusto.onchange=atualizarTaxa;

  // Carência: 3–12 meses (DI), padrão = 1 período (12 anual / 6 semestral)
  for(let m=CARENCIA_MIN;m<=CARENCIA_MAX;m++){
    selectCarencia.add(new Option(m+" meses",m));
  }
  selectCarencia.value=12;

  atualizarSelectPrazo();
  selectCarencia.onchange=atualizarSelectPrazo;
  selectPeriodicidade.onchange=()=>{
    selectCarencia.value=periodoMeses();   // volta ao padrão: 1 período
    atualizarSelectPrazo();
  };
  selectPrazo.onchange=atualizarStrip;

  percEntrada.oninput=()=>{
    let p=parseFloat(percEntrada.value);
    if(p>100){percEntrada.value=100;p=100;}
    let v=parseBR(valor.value);
    if(!v||isNaN(p))return;
    valorEntrada.value=format2(v*p/100);
  };
  percEntrada.onblur=()=>{
    let p=parseFloat(percEntrada.value);
    if(isNaN(p))return;
    p=Math.min(Math.max(Math.round(p),0),100);
    percEntrada.value=p;
    let v=parseBR(valor.value);
    if(v)valorEntrada.value=format2(v*p/100);
  };
  valorEntrada.oninput=()=>{
    let v=parseBR(valor.value);
    let e=parseBR(valorEntrada.value);
    if(!v||!e){percEntrada.value='';return;}
    percEntrada.value=Math.min(Math.round(e/v*100),100);
  };
  valorEntrada.onblur=()=>{
    let v=parseBR(valor.value);
    let e=parseBR(valorEntrada.value);
    if(!v||!e)return;
    let p=Math.min(Math.round(e/v*100),100);
    percEntrada.value=p;
    valorEntrada.value=format2(v*p/100);
  };
};

// ========= SIMULAÇÃO =========
function simular(){
  gtag('event','simular',{simulador:document.title});
  let valorV=parseBR(valor.value);
  if(!valorV){alert("Informe o Valor do Bem.");return;}
  let perc=Math.min(Math.max(Math.round(parseFloat(percEntrada.value||0)),0),100);
  let entrada=round2(valorV*perc/100);
  valorEntrada.value=format2(entrada);
  percEntrada.value=perc;

  let saldoInicial=round2(valorV-entrada);
  if(saldoInicial<=0){alert("Com 100% de entrada não há valor a financiar.");return;}

  let mesesCar=parseInt(selectCarencia.value);
  let periodo=periodoMeses();
  let prazoMeses=parseInt(selectPrazo.value)*12;
  let nParcelas=calcNParcelas(mesesCar,periodo,prazoMeses);
  let prazoTotal=calcPrazoTotal(mesesCar,periodo,prazoMeses);

  // SAC como no Excel oficial: amortização constante, sem arredondar antes (exibe 2 casas)
  let amort=saldoInicial/nParcelas;
  let saldo=saldoInicial;

  tabela=[];
  let fluxo=[{t:0,valor:-saldoInicial}];
  let tAcum=0;

  let base=hoje();
  // sem linha de carência separada: a 1ª parcela já inclui os juros de toda a carência
  let data0=gerarData(base,mesesCar);
  let anterior=base;

  for(let i=0;i<nParcelas;i++){
    let dataAtual=(i===0)?data0:gerarData(data0,i*periodo);
    let dias=Math.round((dataAtual-anterior)/86400000);
    let juros=jurosPeriodo(saldo,taxaAnual,dias,dataAtual);
    let parcela=amort+juros;
    tabela.push([i+1,dataAtual.toLocaleDateString("pt-BR"),saldo,amort,juros,parcela]);
    tAcum+=dias/diasNoAno(dataAtual);
    fluxo.push({t:tAcum,valor:parcela});
    saldo-=amort;
    anterior=dataAtual;
  }

  let cetAnual=calcularCETAnual(fluxo);
  let cetMensal=aaParaAm(cetAnual);

  let totAmort=round2(tabela.reduce((a,r)=>a+r[3],0));
  let totJuros=round2(tabela.reduce((a,r)=>a+r[4],0));
  let totValor=round2(tabela.reduce((a,r)=>a+r[5],0));
  let labelPer=periodo===6?"Semestral":"Anual";
  let optCusto=TAXAS[selectPorte.value][parseInt(selectCusto.value)];

  simParams={
    valorV,perc,entrada,saldoFin:saldoInicial,
    prazoAnos:parseInt(selectPrazo.value),
    mesesCar,periodo,labelPer,nParcelas,prazoTotal,
    porte:selectPorte.value==="GP"?"Grande Porte":"MPME",
    custo:optCusto.rotulo,
    taxaTxt:fmtTaxa(taxaAnual),
    cetMensal:format2(cetMensal*100),cetAnual:format2(cetAnual*100),
    totAmort,totJuros,totValor
  };

  let html=`
  <div class="cet-banner">
    <div class="cet-item"><span class="cet-label">CET</span><span class="cet-value">${format2(cetMensal*100)}% a.m.</span></div>
    <div class="cet-item"><span class="cet-label">CET</span><span class="cet-value">${format2(cetAnual*100)}% a.a.</span></div>
    <div class="cet-item"><span class="cet-label">Total de Juros</span><span class="cet-value">R$ ${format2(totJuros)}</span></div>
    <div class="cet-item"><span class="cet-label">Total Pago</span><span class="cet-value">R$ ${format2(totValor)}</span></div>
  </div>
  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Data</th>
        <th>Saldo Devedor</th>
        <th>Amortização</th>
        <th>Juros</th>
        <th>Valor Parcela</th>
      </tr>
    </thead>
    <tbody>`;

  tabela.forEach(r=>{
    html+=`<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${format2(r[2])}</td>
      <td>${format2(r[3])}</td>
      <td>${format2(r[4])}</td>
      <td><strong>${format2(r[5])}</strong></td>
    </tr>`;
  });

  html+=`
    </tbody>
    <tfoot>
      <tr>
        <td>—</td>
        <td>TOTAL</td>
        <td>—</td>
        <td>${format2(totAmort)}</td>
        <td>${format2(totJuros)}</td>
        <td>${format2(totValor)}</td>
      </tr>
    </tfoot>
  </table>
  </div>
  <div class="protecao">`;

  PROTECAO.forEach(t=>{html+=`<p>${t}</p>`;});
  html+=`</div>`;

  resultado.innerHTML=html;
}

// ========= PDF =========
function gerarPDF(){
  if(!tabela.length){alert("Simule primeiro.");return;}
  gtag('event','gerar_pdf',{simulador:document.title});

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=doc.internal.pageSize.getWidth();
  const H=doc.internal.pageSize.getHeight();
  const BLUE=[27,60,107];
  const WHITE=[255,255,255];
  const GRAY=[90,99,119];
  const now=new Date();
  const p=simParams;

  // faixa azul
  doc.setFillColor(...BLUE);
  doc.rect(0,0,W,8,"F");
  doc.setFontSize(7);
  doc.setFont("helvetica","bold");
  doc.setTextColor(...WHITE);
  doc.text("Simulador +Inovação Rural CE  |  Linha CE / Construção BNDES",10,5.2);
  doc.setFont("helvetica","normal");
  doc.setFontSize(6.5);
  doc.setTextColor(180,200,230);
  doc.text(`Simulado em ${now.toLocaleDateString("pt-BR")} às ${now.toTimeString().slice(0,5)}`,W-10,5.2,{align:"right"});

  // bloco parâmetros
  let y=13;
  doc.setFillColor(248,249,252);
  doc.setDrawColor(221,227,237);
  doc.roundedRect(10,y,W-20,40,2,2,"FD");

  doc.setFontSize(6.2);
  doc.setFont("helvetica","bold");
  doc.setTextColor(...GRAY);
  doc.text("PARÂMETROS DA SIMULAÇÃO",14,y+5);

  const campos=[
    ["Valor do Bem",      `R$ ${format2(p.valorV)}`],
    ["Entrada",           `${p.perc}%  (R$ ${format2(p.entrada)})`],
    ["Saldo Financiado",  `R$ ${format2(p.saldoFin)}`],
    ["Porte / Custo",     `${p.porte}  |  ${p.custo}`],
    ["Taxa de Juros",     p.taxaTxt],
    ["Carência",          `${p.mesesCar} meses`],
    ["Periodicidade",     p.labelPer],
    ["Nº de Parcelas",    `${p.nParcelas} parcelas`],
    ["Prazo Total",       `${p.prazoTotal} meses`],
    ["CET",               `${p.cetMensal}% a.m.  |  ${p.cetAnual}% a.a.`],
    ["Total de Juros",    `R$ ${format2(p.totJuros)}`],
    ["Total Pago",        `R$ ${format2(p.totValor)}`],
  ];

  // 3 linhas × 4 colunas
  const colW=(W-20)/4;
  campos.forEach(([lbl,val],i)=>{
    let cx=10+(i%4)*colW+3;
    let cy=y+10+Math.floor(i/4)*11;
    doc.setFontSize(6);
    doc.setFont("helvetica","normal");
    doc.setTextColor(...GRAY);
    doc.text(lbl.toUpperCase(),cx,cy);
    doc.setFontSize(7.3);
    doc.setFont("helvetica","bold");
    doc.setTextColor(15,20,45);
    doc.text(val,cx,cy+4.5);
  });

  y+=44;

  // tabela
  const marginL=10,marginR=10;
  const tableW=W-marginL-marginR;
  const colNum=10;
  const colRest=(tableW-colNum)/5;

  const head=[["#","Data","Saldo Devedor\n(R$)","Amortização\n(R$)","Juros\n(R$)","Valor Parcela\n(R$)"]];

  const rows=tabela.map(r=>[
    String(r[0]),
    r[1],
    format2(r[2]),
    format2(r[3]),
    format2(r[4]),
    format2(r[5])
  ]);

  rows.push([
    "TOTAL","","—",
    format2(p.totAmort),
    format2(p.totJuros),
    format2(p.totValor)
  ]);

  doc.autoTable({
    startY:y,
    head:head,
    body:rows,
    margin:{left:marginL,right:marginR},
    styles:{
      font:"helvetica",
      fontSize:6.8,
      cellPadding:1.8,
      textColor:[15,20,45],
      lineColor:[221,227,237],
      lineWidth:0.15,
      overflow:"linebreak"
    },
    headStyles:{
      fillColor:BLUE,
      textColor:WHITE,
      fontSize:6.2,
      fontStyle:"bold",
      halign:"right",
      cellPadding:2,
      minCellHeight:0
    },
    columnStyles:{
      0:{halign:"center",cellWidth:colNum},
      1:{halign:"left",  cellWidth:colRest},
      2:{halign:"right", cellWidth:colRest},
      3:{halign:"right", cellWidth:colRest},
      4:{halign:"right", cellWidth:colRest},
      5:{halign:"right", cellWidth:colRest,fontStyle:"bold"}
    },
    alternateRowStyles:{fillColor:[248,249,252]},
    didParseCell:function(data){
      if(data.section==="body"){
        if(data.row.index===rows.length-1){
          data.cell.styles.fillColor=BLUE;
          data.cell.styles.textColor=WHITE;
          data.cell.styles.fontStyle="bold";
          data.cell.styles.fontSize=7.2;
        }
      }
    }
  });

  // texto de proteção
  let finalY=doc.lastAutoTable.finalY+5;
  const maxTxtW=W-28;

  doc.setFontSize(6.2);
  doc.setFont("helvetica","normal");
  let textoLinhas=[];
  PROTECAO.forEach(t=>{
    textoLinhas.push(...doc.splitTextToSize(t,maxTxtW),"");
  });
  textoLinhas.pop();
  let altBloco=textoLinhas.length*3.4+9;

  if(finalY+altBloco>H-8){doc.addPage();finalY=12;}

  doc.setFillColor(248,249,252);
  doc.setDrawColor(221,227,237);
  doc.roundedRect(10,finalY,W-20,altBloco,2,2,"FD");

  doc.setFontSize(6.2);
  doc.setFont("helvetica","bold");
  doc.setTextColor(...GRAY);
  doc.text("INFORMAÇÕES IMPORTANTES",14,finalY+5);

  doc.setFont("helvetica","normal");
  doc.setTextColor(70,80,100);
  let ty=finalY+9.5;
  textoLinhas.forEach(linha=>{
    if(ty>H-10){doc.addPage();ty=12;}
    doc.text(linha,14,ty);
    ty+=3.4;
  });

  function fmtK(v){
    if(v>=1000000){let m=v/1000000;return(m%1===0?String(Math.round(m)):m.toFixed(1).replace('.',','))+' mi';}
    let k=v/1000;return(k%1===0?String(Math.round(k)):k.toFixed(1).replace('.',','))+' mil';
  }
  doc.save(`+Inovação Rural CE ${fmtK(p.valorV)} ${p.perc}% ${p.prazoAnos} anos.pdf`);
}
