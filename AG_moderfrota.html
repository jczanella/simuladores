<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --blue:#1b3c6b;
  --blue-light:#2451a0;
  --blue-pale:#e8eef7;
  --bg:#f5f7fa;
  --card:#ffffff;
  --text:#1a1a2e;
  --text-soft:#5a6377;
  --border:#dde3ed;
  --radius:14px;
  --shadow:0 2px 8px rgba(27,60,107,.10);
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:48px;
}

header{
  background:var(--blue);
  color:#fff;
  padding:20px 20px 18px;
  display:flex;
  align-items:center;
  gap:14px;
}
.header-text h1{font-size:1.1rem;font-weight:700;letter-spacing:.2px;}
.header-text p{font-size:.78rem;opacity:.72;margin-top:3px;}

main{max-width:900px;margin:0 auto;padding:28px 16px 0;}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 20px;
  margin-bottom:20px;
}
.card-title{
  font-size:.75rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  color:var(--text-soft);
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{
  font-size:.72rem;font-weight:600;
  letter-spacing:.4px;text-transform:uppercase;
  color:var(--text-soft);
}
.field input,.field select{
  padding:9px 11px;
  border:1.5px solid var(--border);
  border-radius:8px;
  font-family:inherit;
  font-size:.93rem;
  color:var(--text);
  background:#fff;
  outline:none;
  transition:border-color .15s;
  width:100%;
}
.field input:focus,.field select:focus{border-color:var(--blue);}
.field .hint{font-size:.7rem;color:#b45309;font-weight:600;}
.field .hint:empty{display:none;}
.field .hint-soft{font-size:.7rem;color:var(--text-soft);}
.field input[readonly]{
  background:#f5f7fa;
  color:var(--text-soft);
  cursor:default;
}

/* info strip */
.info-strip{
  margin-top:14px;
  background:var(--blue-pale);
  border:1px solid #c3d1e8;
  border-radius:8px;
  padding:9px 14px;
  font-size:.8rem;
  color:var(--blue);
  font-weight:600;
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}
.info-strip span{opacity:.8;}
.info-strip strong{opacity:1;}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 20px;
  border:none;border-radius:8px;
  font-family:inherit;font-size:.88rem;font-weight:600;
  cursor:pointer;transition:all .15s;
  text-decoration:none;
}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-light);}
.btn-secondary{background:var(--bg);color:var(--blue);border:1.5px solid var(--border);}
.btn-secondary:hover{background:var(--blue-pale);border-color:var(--blue);}
.btn-ghost{background:transparent;color:rgba(255,255,255,.8);border:1.5px solid rgba(255,255,255,.3);margin-left:auto;}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
.btn svg{width:16px;height:16px;fill:currentColor;}

#resultado{margin-top:4px;}

.cet-banner{
  background:var(--blue-pale);
  border:1px solid #c3d1e8;
  border-radius:10px;
  padding:12px 18px;
  display:flex;align-items:center;gap:18px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.cet-item{display:flex;flex-direction:column;gap:2px;}
.cet-label{font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-soft);}
.cet-value{font-size:1.05rem;font-weight:700;color:var(--blue);}

.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{
  width:100%;border-collapse:collapse;
  background:#fff;font-size:.83rem;
  font-variant-numeric:tabular-nums;
}
thead th{
  background:var(--blue);color:#fff;
  padding:9px 12px;text-align:right;
  font-size:.72rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  white-space:nowrap;
}
thead th:first-child{text-align:center;width:52px;}
thead th:nth-child(2){text-align:left;}

tbody tr:nth-child(even){background:#f8f9fc;}
tbody td{

  border-bottom:1px solid #eef0f5;
  color:var(--text);
}

tfoot tr{background:var(--blue);}
tfoot td{
  padding:9px 12px;text-align:right;
  color:#fff;font-weight:700;font-size:.83rem;
  font-variant-numeric:tabular-nums;
}
tfoot td:first-child{text-align:center;width:52px;font-weight:400;opacity:.8;}
tfoot td:nth-child(2){text-align:left;font-weight:400;opacity:.8;}
tfoot td:nth-child(3){opacity:.8;font-weight:400;}

.protecao{

  background:#fff;

  margin-bottom:4px;
}
.protecao p:last-child{margin-bottom:0;}

<body>

<header>
  <div class="header-text">
    <h1>Simulador Moderfrota</h1>
    <p>Linha AG / BNDES · SAC · Semestral ou Anual</p>
  </div>
  <a href="index.html" class="btn btn-ghost" style="padding:8px 14px;font-size:.82rem;">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Voltar ao Início
  </a>
</header>

<main>

  <div class="card">
    <div class="card-title">Parâmetros da Simulação</div>

    <div class="form-grid">

      <div class="field">
        <label>Valor do Bem (R$)</label>
        <input id="valor" placeholder="0">
      </div>

      <div class="field">
        <label>Entrada (%)</label>
        <input id="percEntrada" type="number" min="15" max="100" step="1">
        <small class="hint-soft">Mínimo 15%</small>
      </div>

      <div class="field">
        <label>Entrada (R$)</label>
        <input id="valorEntrada" placeholder="0">
      </div>

      <div class="field">
        <label>Valor Financiado (R$)</label>
        <input id="valorFinanciado" placeholder="0" readonly tabindex="-1">
      </div>

      <div class="field">
        <label>Periodicidade</label>
        <select id="selectPeriodicidade">
          <option value="12">Anual (a cada 12 meses)</option>
          <option value="6">Semestral (a cada 6 meses)</option>
        </select>
      </div>

      <div class="field">
        <label>Carência</label>
        <select id="selectCarencia"></select>
      </div>

      <div class="field">
        <label>Número de Parcelas</label>
        <select id="selectParcelas"></select>
      </div>

      <div class="field">
        <label>Taxa de Juros</label>
        <select id="selectTaxa"></select>
        <small id="avisoTaxa" class="hint"></small>
      </div>

    </div>

    <div class="info-strip" id="infoStrip">
      <span>Selecione os parâmetros acima para ver o resumo da operação</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="simular()">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
        Simular
      </button>
      <button class="btn btn-secondary" onclick="gerarPDF()">
        <svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
        Gerar PDF
      </button>
    </div>
  </div>

  <div id="resultado"></div>

</main>

<script>

// ========= UTIL =========
function parseBR(v){return Number((v||"").replace(/\./g,"").replace(",",".")||0);}
function round2(v){return Math.round(v*100)/100;}
function format2(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}

function mask(el){
  el.addEventListener("input",()=>{
    let raw=el.value.replace(/\D/g,"");
    if(!raw){el.value="";return;}
    el.value=Number(raw).toLocaleString("pt-BR");
  });
}

// ========= TAXAS =========
// Padrão 12,5% a.a.; 10,5% a.a. = Moderfrota Campanha (mostra aviso do flat SÓ na tela).
const TAXAS_AA=[0.125,0.105];
const AVISO_TAXA={1:"O flat para o Moderfrota Campanha de 10,5% a.a. é de 5,4%."};
let taxaAnual=TAXAS_AA[0];
function aaParaAm(aa){return Math.pow(1+aa,1/12)-1;}

// ========= ENTRADA =========
const ENTRADA_MIN=15; // % mínimo, sempre inteiro

// ========= PRAZO =========
// Periodicidade anual (padrão) ou semestral. Carência selecionável de 3 a 14 meses; padrão =
// 1 período (12 anual / 6 semestral), mesma regra do Pronaf: gerarData(hoje, meses) → dia 15,
// próximo dia útil, sem compensação de rollover. O nº máximo de parcelas é o que cabe no
// teto de 84 meses a partir da carência escolhida.
const CARENCIA_MIN=3;
const CARENCIA_MAX=14;
const PRAZO_MAX_MESES=84;
function periodoMeses(){return parseInt(selectPeriodicidade.value);}
function calcNMaxParcelas(mesesCar){
  return Math.floor((PRAZO_MAX_MESES-mesesCar)/periodoMeses())+1;
}

// ========= FERIADOS NACIONAIS (calculados, sem limite de ano) =========
// Fixos + móveis baseados na Páscoa (Carnaval seg/ter, Sexta-feira Santa, Corpus Christi).
function pascoa(ano){
  let a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(ano,mes-1,dia);
}
const _feriadosCache={};
function feriadosDoAno(ano){
  if(_feriadosCache[ano])return _feriadosCache[ano];
  let p=pascoa(ano);
  let rel=n=>{let d=new Date(p);d.setDate(d.getDate()+n);return d;};
  let lista=[
    new Date(ano,0,1),rel(-48),rel(-47),rel(-2),new Date(ano,3,21),new Date(ano,4,1),
    rel(60),new Date(ano,8,7),new Date(ano,9,12),new Date(ano,10,2),new Date(ano,10,15),
    new Date(ano,10,20),new Date(ano,11,25)
  ];
  return _feriadosCache[ano]=new Set(lista.map(d=>d.toDateString()));
}
function eFeriado(d){return feriadosDoAno(d.getFullYear()).has(d.toDateString());}
function proximoDiaUtil(d){
  let r=new Date(d);
  while(r.getDay()===0||r.getDay()===6||eFeriado(r)) r.setDate(r.getDate()+1);
  return r;
}
function gerarData(base,mes){
  let d=new Date(base);
  d.setMonth(d.getMonth()+mes);
  d.setDate(15);
  return proximoDiaUtil(d);
}

// ========= JUROS =========
// Validado contra a simulação oficial do banco (Simulacao_Moderfrota_...pdf): denominador
// VARIÁVEL conforme o ano do vencimento (366 em ano bissexto) — igual ao Pronamp CE e
// DIFERENTE do Pronaf (365 fixo). Ex.: 15/09/2027→15/09/2028 (366 dias) = exatamente 12,5%.
function diasNoAno(data){
  let a=data.getFullYear();
  return (a%4===0&&(a%100!==0||a%400===0))?366:365;
}
function jurosPeriodo(saldo,taxaAnual,dias,dataRef){
  let rate=Math.pow(1+taxaAnual,dias/diasNoAno(dataRef))-1;
  return round2(saldo*rate);
}

// ========= CET =========
// Newton-Raphson sobre dias corridos reais (t = dias/365). Bate com o CET do PDF oficial (12,49%).
function calcularCETAnual(fluxo){
  let taxa=0.10;
  for(let k=0;k<200;k++){
    let f=0,df=0;
    fluxo.forEach(fx=>{
      let t=fx.dias/365;
      f+=fx.valor/Math.pow(1+taxa,t);
      df+=-t*fx.valor/Math.pow(1+taxa,t+1);
    });
    if(Math.abs(df)<1e-12)break;
    let nt=taxa-f/df;
    if(Math.abs(nt-taxa)<1e-9)break;
    taxa=nt;
  }
  return taxa;
}

// ========= ESTADO GLOBAL =========
let tabela=[];
let simParams={};

const PROTECAO=[
  "a) As informações apresentadas neste simulador têm caráter meramente informativo e não constituem proposta ou oferta comercial do Agente Financeiro.",
  "b) Todas as condições da simulação são estimativas, calculadas com base nos dados inseridos pelo próprio usuário, podendo divergir dos valores reais praticados, regras específicas do produto financeiro e das normas legais vigentes na época da contratação.",
  "c) As condições comerciais estão sujeitas à aprovação com base na análise de crédito do usuário e políticas internas do Agente Financeiro."
];

// ========= SELECTS =========
function montarSelectCarencia(){
  for(let m=CARENCIA_MIN;m<=CARENCIA_MAX;m++){
    selectCarencia.add(new Option(m+" meses",m));
  }
  selectCarencia.value=periodoMeses(); // padrão = 1 período
}
// Ao trocar a periodicidade: carência volta ao padrão (1 período) e parcelas ao máximo.
function onPeriodicidade(){
  selectCarencia.value=periodoMeses();
  atualizarSelectParcelas(true);
}
function atualizarSelectParcelas(forcarMax){
  let nMax=calcNMaxParcelas(parseInt(selectCarencia.value));
  // se estava no máximo anterior (ou vazio), acompanha o novo máximo
  let eraMax=forcarMax===true||!selectParcelas.value||parseInt(selectParcelas.value)===selectParcelas.options.length;
  let atual=eraMax?nMax:parseInt(selectParcelas.value);
  selectParcelas.innerHTML='';
  for(let n=1;n<=nMax;n++){
    selectParcelas.add(new Option(n,n));
  }
  selectParcelas.value=Math.min(atual,nMax);
  atualizarStrip();
}
function montarSelectTaxa(){
  TAXAS_AA.forEach((aa,i)=>{
    selectTaxa.add(new Option(`${format2(aa*100)}% a.a.`,i));
  });
  selectTaxa.value=0;
  selectTaxa.onchange=()=>{
    let i=parseInt(selectTaxa.value);
    taxaAnual=TAXAS_AA[i];
    avisoTaxa.textContent=AVISO_TAXA[i]||'';
  };
}

// ========= ATUALIZA INFO STRIP =========
function atualizarStrip(){
  let nParcelas=parseInt(selectParcelas.value);
  let mesesCar=parseInt(selectCarencia.value);
  let prazoTotal=mesesCar+(nParcelas-1)*periodoMeses();
  let data0=gerarData(new Date(),mesesCar);
  let sem=periodoMeses()===6;
  let lbl=nParcelas===1?(sem?"parcela semestral":"parcela anual"):(sem?"parcelas semestrais":"parcelas anuais");
  infoStrip.innerHTML=
    `<strong>${nParcelas} ${lbl}</strong>`+
    `<span>1º vencimento: ${data0.toLocaleDateString("pt-BR")}</span>`+
    `<span>Prazo total: ${prazoTotal} meses (${(prazoTotal/12).toFixed(1).replace(".",",")} anos)</span>`;
}

// ========= ENTRADA (% sempre inteiro, mínimo ENTRADA_MIN) =========
function normalizarPerc(p){
  if(isNaN(p))p=ENTRADA_MIN;
  return Math.min(Math.max(Math.round(p),ENTRADA_MIN),100);
}

// ========= INIT =========
window.onload=function(){
  mask(valor);
  mask(valorEntrada);

  montarSelectCarencia();
  montarSelectTaxa();
  atualizarSelectParcelas();
  selectCarencia.onchange=atualizarSelectParcelas;
  selectPeriodicidade.onchange=onPeriodicidade;
  selectParcelas.onchange=atualizarStrip;

  percEntrada.value=ENTRADA_MIN;

  // Valor do Bem → mantém o % de entrada e recalcula Entrada (R$) e Financiado.
  valor.addEventListener("input",()=>{
    let v=parseBR(valor.value);
    let p=parseFloat(percEntrada.value);
    if(v&&!isNaN(p))valorEntrada.value=format2(v*p/100);
    atualizarFinanciado();
  });

  // Entrada (%) → atualiza R$ enquanto digita; ao sair, arredonda p/ inteiro e aplica mínimo.
  percEntrada.oninput=()=>{
    let p=parseFloat(percEntrada.value);
    if(p>100){percEntrada.value=100;p=100;}
    let v=parseBR(valor.value);
    if(v&&!isNaN(p))valorEntrada.value=format2(v*p/100);
    atualizarFinanciado();
  };
  percEntrada.onblur=()=>{
    let p=normalizarPerc(parseFloat(percEntrada.value));
    percEntrada.value=p;
    let v=parseBR(valor.value);
    if(v)valorEntrada.value=format2(v*p/100);
    atualizarFinanciado();
  };

  // Entrada (R$) → mostra % enquanto digita; ao sair, arredonda o % p/ inteiro (mín. 15%)
  // e reajusta o R$ para bater com esse %.
  // IMPORTANTE: NÃO sobrescrever valorEntrada.value no oninput — quebra digitação no celular.
  valorEntrada.oninput=()=>{
    let v=parseBR(valor.value);
    let e=parseBR(valorEntrada.value);
    if(!v||!e){atualizarFinanciado();return;}
    percEntrada.value=Math.min(Math.round(e/v*100),100);
    atualizarFinanciado();
  };
  valorEntrada.onblur=()=>{
    let v=parseBR(valor.value);
    if(!v)return;
    let e=parseBR(valorEntrada.value);
    let p=normalizarPerc(e?e/v*100:NaN);
    percEntrada.value=p;
    valorEntrada.value=format2(v*p/100);
    atualizarFinanciado();
  };
};

// ========= VALOR FINANCIADO (somente leitura, derivado) =========
function atualizarFinanciado(){
  let v=parseBR(valor.value);
  if(!v){valorFinanciado.value='';return;}
  let e=parseBR(valorEntrada.value);
  valorFinanciado.value=format2(round2(Math.max(v-e,0)));
}

// ========= SIMULAÇÃO =========
function simular(){
  gtag('event','simular',{simulador:document.title});
  let valorV=parseBR(valor.value);
  if(!valorV){alert("Informe o Valor do Bem.");return;}
  let perc=normalizarPerc(parseFloat(percEntrada.value));
  let entrada=round2(valorV*perc/100);
  valorEntrada.value=format2(entrada);
  percEntrada.value=perc;
  atualizarFinanciado();

  let periodo=periodoMeses();
  let nParcelas=parseInt(selectParcelas.value);
  let labelPer=periodo===6?"Semestral":"Anual";
  let base=new Date();
  let mesesCar=parseInt(selectCarencia.value);
  let prazoTotal=mesesCar+(nParcelas-1)*periodo;

  let saldoInicial=round2(valorV-entrada);
  // Amortização SAC constante em TODAS as parcelas (validado contra a simulação oficial:
  // a última parcela NÃO absorve o resíduo de arredondamento, diferente do Pronamp CE).
  let amort=round2(saldoInicial/nParcelas);
  let saldo=saldoInicial;

  tabela=[];

  // fluxo real por dias corridos desde a liberação (t=0) — ver calcularCETAnual()
  let fluxo=[{dias:0,valor:-saldoInicial}];

  let data0=gerarData(base,mesesCar);
  let anterior=base;

  for(let i=0;i<nParcelas;i++){
    let dataAtual=(i===0)?data0:gerarData(data0,i*periodo);
    let dias=Math.floor((dataAtual-anterior)/86400000);
    let juros=jurosPeriodo(saldo,taxaAnual,dias,dataAtual);
    let parcela=round2(juros+amort);
    tabela.push([i+1,dataAtual.toLocaleDateString("pt-BR"),saldo,amort,juros,parcela]);
    fluxo.push({dias:Math.floor((dataAtual-base)/86400000),valor:parcela});
    saldo=round2(saldo-amort);
    anterior=dataAtual;
  }

  let cetAnual=calcularCETAnual(fluxo);
  let cetMensal=Math.pow(1+cetAnual,1/12)-1;

  let totAmort=round2(tabela.reduce((a,r)=>a+r[3],0));
  let totJuros=round2(tabela.reduce((a,r)=>a+r[4],0));
  // Total a pagar = financiado + total de juros (igual ao PDF oficial: R$ 1.270.514,99 no
  // cenário de referência). Pode diferir em R$ 0,01 da soma das parcelas, porque a amortização
  // constante não absorve o resíduo de arredondamento — o PDF do banco tem a mesma diferença.
  let totValor=round2(saldoInicial+totJuros);

  simParams={
    valorV,perc,entrada,saldoFin:saldoInicial,
    periodoMeses:periodo,labelPer,nParcelas,prazoTotal,mesesCar,
    taxaTxt:`${format2(taxaAnual*100)}% a.a.  |  ${format2(aaParaAm(taxaAnual)*100)}% a.m.`,
    cetMensal:format2(cetMensal*100),cetAnual:format2(cetAnual*100),
    totAmort,totJuros,totValor
  };

  let html=`
  <div class="cet-banner">
    <div class="cet-item"><span class="cet-label">CET</span><span class="cet-value">${format2(cetMensal*100)}% a.m.</span></div>
    <div class="cet-item"><span class="cet-label">CET</span><span class="cet-value">${format2(cetAnual*100)}% a.a.</span></div>
    <div class="cet-item"><span class="cet-label">Total de Juros</span><span class="cet-value">R$ ${format2(totJuros)}</span></div>
    <div class="cet-item"><span class="cet-label">Total Pago</span><span class="cet-value">R$ ${format2(totValor)}</span></div>
  </div>
  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Data</th>
        <th>Saldo Devedor</th>
        <th>Amortização</th>
        <th>Juros</th>
        <th>Valor Parcela</th>
      </tr>
    </thead>
    <tbody>`;

  tabela.forEach(r=>{
    html+=`<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${format2(r[2])}</td>
      <td>${format2(r[3])}</td>
      <td>${format2(r[4])}</td>
      <td><strong>${format2(r[5])}</strong></td>
    </tr>`;
  });

  html+=`
    </tbody>
    <tfoot>
      <tr>
        <td>—</td>
        <td>TOTAL</td>
        <td>—</td>
        <td>${format2(totAmort)}</td>
        <td>${format2(totJuros)}</td>
        <td>${format2(totValor)}</td>
      </tr>
    </tfoot>
  </table>
  </div>
  <div class="protecao">`;

  PROTECAO.forEach(t=>{html+=`<p>${t}</p>`;});
  html+=`</div>`;

  resultado.innerHTML=html;
}

// ========= PDF =========
function gerarPDF(){
  if(!tabela.length){alert("Simule primeiro.");return;}
  gtag('event','gerar_pdf',{simulador:document.title});

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=doc.internal.pageSize.getWidth();
  const H=doc.internal.pageSize.getHeight();
  const BLUE=[27,60,107];
  const WHITE=[255,255,255];
  const GRAY=[90,99,119];
  const now=new Date();
  const p=simParams;

  // faixa azul
  doc.setFillColor(...BLUE);
  doc.rect(0,0,W,8,"F");
  doc.setFontSize(7);
  doc.setFont("helvetica","bold");
  doc.setTextColor(...WHITE);
  doc.text("Simulador Moderfrota  |  Linha AG / BNDES",10,5.2);
  doc.setFont("helvetica","normal");
  doc.setFontSize(6.5);
  doc.setTextColor(180,200,230);
  doc.text(`Simulado em ${now.toLocaleDateString("pt-BR")} às ${now.toTimeString().slice(0,5)}`,W-10,5.2,{align:"right"});

  // bloco parâmetros
  let y=13;
  doc.setFillColor(248,249,252);
  doc.setDrawColor(221,227,237);
  doc.roundedRect(10,y,W-20,40,2,2,"FD");

  doc.setFontSize(6.2);
  doc.setFont("helvetica","bold");
  doc.setTextColor(...GRAY);
  doc.text("PARÂMETROS DA SIMULAÇÃO",14,y+5);

  const campos=[
    ["Valor do Bem",      `R$ ${format2(p.valorV)}`],
    ["Entrada",           `${p.perc}%  (R$ ${format2(p.entrada)})`],
    ["Saldo Financiado",  `R$ ${format2(p.saldoFin)}`],
    ["Taxa de Juros",     p.taxaTxt],
    ["Periodicidade",     p.labelPer],
    ["Carência",          `${p.mesesCar} ${p.mesesCar===1?"mês":"meses"}`],
    ["Nº de Parcelas",    `${p.nParcelas} ${p.nParcelas===1?"parcela":"parcelas"}`],
    ["Prazo Total",       `${p.prazoTotal} meses`],
    ["CET",               `${p.cetMensal}% a.m.  |  ${p.cetAnual}% a.a.`],
    ["Total de Juros",    `R$ ${format2(p.totJuros)}`],
    ["Total Pago",        `R$ ${format2(p.totValor)}`],
  ];

  const colW=(W-20)/4;
  campos.forEach(([lbl,val],i)=>{
    let cx=10+(i%4)*colW+3;
    let cy=y+8+Math.floor(i/4)*11;
    if(cy>y+38)return;
    doc.setFontSize(6);
    doc.setFont("helvetica","normal");
    doc.setTextColor(...GRAY);
    doc.text(lbl.toUpperCase(),cx,cy);
    doc.setFontSize(7.5);
    doc.setFont("helvetica","bold");
    doc.setTextColor(15,20,45);
    doc.text(val,cx,cy+4.5);
  });

  y+=44;

  // tabela
  const marginL=10,marginR=10;
  const tableW=W-marginL-marginR;
  const colNum=10;
  const colRest=(tableW-colNum)/5;

  const head=[["#","Data","Saldo Devedor\n(R$)","Amortização\n(R$)","Juros\n(R$)","Valor Parcela\n(R$)"]];

  const rows=tabela.map(r=>[
    String(r[0]),
    r[1],
    format2(r[2]),
    format2(r[3]),
    format2(r[4]),
    format2(r[5])
  ]);

  rows.push([
    "TOTAL","","—",
    format2(p.totAmort),
    format2(p.totJuros),
    format2(p.totValor)
  ]);

  doc.autoTable({
    startY:y,
    head:head,
    body:rows,
    margin:{left:marginL,right:marginR},
    styles:{
      font:"helvetica",
      fontSize:6.8,
      cellPadding:1.8,
      textColor:[15,20,45],
      lineColor:[221,227,237],
      lineWidth:0.15,
      overflow:"linebreak"
    },
    headStyles:{
      fillColor:BLUE,
      textColor:WHITE,
      fontSize:6.2,
      fontStyle:"bold",
      halign:"right",
      cellPadding:2,
      minCellHeight:0
    },
    columnStyles:{
      0:{halign:"center",cellWidth:colNum},
      1:{halign:"left",  cellWidth:colRest},
      2:{halign:"right", cellWidth:colRest},
      3:{halign:"right", cellWidth:colRest},
      4:{halign:"right", cellWidth:colRest},
      5:{halign:"right", cellWidth:colRest,fontStyle:"bold"}
    },
    alternateRowStyles:{fillColor:[248,249,252]},
    didParseCell:function(data){
      if(data.section==="body"){
        if(data.row.index===rows.length-1){
          data.cell.styles.fillColor=BLUE;
          data.cell.styles.textColor=WHITE;
          data.cell.styles.fontStyle="bold";
          data.cell.styles.fontSize=7.2;
        }
      }
    }
  });

  // texto de proteção
  let finalY=doc.lastAutoTable.finalY+5;
  const maxTxtW=W-28;

  doc.setFontSize(6.2);
  doc.setFont("helvetica","normal");
  let textoLinhas=[];
  PROTECAO.forEach(t=>{
    textoLinhas.push(...doc.splitTextToSize(t,maxTxtW),"");
  });
  textoLinhas.pop();
  let altBloco=textoLinhas.length*3.4+9;

  if(finalY+altBloco>H-8){doc.addPage();finalY=12;}

  doc.setFillColor(248,249,252);
  doc.setDrawColor(221,227,237);
  doc.roundedRect(10,finalY,W-20,altBloco,2,2,"FD");

  doc.setFontSize(6.2);
  doc.setFont("helvetica","bold");
  doc.setTextColor(...GRAY);
  doc.text("INFORMAÇÕES IMPORTANTES",14,finalY+5);

  doc.setFont("helvetica","normal");
  doc.setTextColor(70,80,100);
  let ty=finalY+9.5;
  textoLinhas.forEach(linha=>{
    if(ty>H-10){doc.addPage();ty=12;}
    doc.text(linha,14,ty);
    ty+=3.4;
  });

  function fmtK(v){
    if(v>=1000000){let m=v/1000000;return(m%1===0?String(Math.round(m)):m.toFixed(1).replace('.',','))+' mi';}
    let k=v/1000;return(k%1===0?String(Math.round(k)):k.toFixed(1).replace('.',','))+' mil';
  }
  doc.save(`Moderfrota ${fmtK(p.valorV)} ${p.perc}% ${p.nParcelas}par.pdf`);
}

</script>

  window.addEventListener('load',()=>{

  });
